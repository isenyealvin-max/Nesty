<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nesty Admin</title>
<link rel="icon" href="/icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f5f5;color:#1a1a1a;line-height:1.5}
main{max-width:620px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;margin:8px 0 2px}
.card{background:#fff;border:1.5px solid #b5b5b5;border-radius:12px;padding:14px;margin:12px 0}
label{display:block;font-size:13.5px;color:#4a4a4a;margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border:1.5px solid #b5b5b5;border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
button{padding:11px 16px;border:0;border-radius:10px;background:#1a1a1a;color:#fff;font-size:15px;font-weight:600;margin-top:12px;cursor:pointer}
button.alt{background:#fff;color:#1a1a1a;border:1.5px solid #b5b5b5}
.row{display:flex;gap:8px}.row>*{flex:1}
pre{background:#f0f0f0;border-radius:10px;padding:12px;font-size:15px;white-space:pre-wrap;word-break:break-all;margin:10px 0 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 6px;border-bottom:1px solid #ddd;text-align:left}
.ok{color:#2e7d32}.bad{color:#d32f2f}.muted{color:#6b6b6b;font-size:13.5px}
.used{opacity:.55}
</style>
</head>
<body>
<main>
<h1>Nesty Admin</h1>
<div class="muted">Make activation codes and see which are used. Only you should open this page.</div>

<div class="card">
  <label for="key">Admin key</label>
  <input id="key" type="password" autocomplete="off" placeholder="Your ADMIN_KEY secret">
  <div class="muted" style="margin-top:6px">Kept only until you close this tab.</div>
</div>

<div class="card">
  <b>New codes</b>
  <div class="row">
    <div><label for="plan">Plan</label><select id="plan"><option value="premium">Premium</option><option value="go">Go</option><option value="pro">Pro</option><option value="learnover">Learnover</option><option value="ultra">Ultra</option></select></div>
    <div><label for="period">Period</label><select id="period"><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
  </div>
  <div class="row">
    <div><label for="count">How many (1 to 50)</label><input id="count" type="number" min="1" max="50" value="1" inputmode="numeric"></div>
    <div><label for="label">Note (who paid)</label><input id="label" maxlength="60" placeholder="e.g. Amina 0712..."></div>
  </div>
  <button onclick="gen()">Generate codes</button>
  <div id="genOut"></div>
</div>

<div class="card">
  <b>All codes</b>
  <div><button class="alt" onclick="loadList()">Refresh list</button></div>
  <div id="list" style="margin-top:10px;overflow-x:auto"></div>
</div>
<div class="card">
  <b>Feedback from users</b>
  <div class="row" style="margin-top:8px"><div><select id="fbFilter" onchange="renderFb()"><option value="all">All</option><option value="down">👎 Not helpful</option><option value="up">👍 Helpful</option></select></div><div><button class="alt" style="margin-top:0" onclick="loadFeedback()">Load feedback</button></div></div>
  <div id="fbSummary" class="muted" style="margin-top:8px"></div>
  <div id="fbList" style="margin-top:8px"></div>
</div>
<div id="msg" class="muted"></div>
</main>
<script>
function $(id){ return document.getElementById(id); }
try{ $("key").value = sessionStorage.getItem("nestyAdminKey") || ""; }catch(e){}
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
async function call(path, payload){
  var k = $("key").value.trim();
  if(!k){ $("msg").innerHTML = '<span class="bad">Enter your admin key first.</span>'; return null; }
  try{ sessionStorage.setItem("nestyAdminKey", k); }catch(e){}
  $("msg").textContent = "Working...";
  try{
    var r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Admin-Key": k}, body: JSON.stringify(payload || {})});
    var d = await r.json();
    if(!r.ok){ $("msg").innerHTML = '<span class="bad">' + esc(d.error || "Failed") + '</span>'; return null; }
    $("msg").textContent = "";
    return d;
  }catch(e){ $("msg").innerHTML = '<span class="bad">Network error.</span>'; return null; }
}
async function gen(){
  var d = await call("/api/admin/generate", {plan: $("plan").value, period: $("period").value, count: parseInt($("count").value, 10) || 1, label: $("label").value});
  if(!d) return;
  var txt = d.codes.join("\n");
  $("genOut").innerHTML = '<pre id="codesTxt">' + esc(txt) + '</pre><div class="muted">' + esc(d.plan) + " " + esc(d.period) + " - KSh " + esc(d.price) + ' each. Copy them now: only a scrambled version is stored, so they cannot be shown again.</div><button class="alt" onclick="copyCodes()">Copy codes</button>';
  loadList();
}
function copyCodes(){
  var t = $("codesTxt").textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ $("msg").textContent = "Copied."; }); }
  else{ var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); $("msg").textContent = "Copied."; }
}
function dt(ms){ try{ return new Date(ms).toLocaleString([], {dateStyle: "medium", timeStyle: "short"}); }catch(e){ return ""; } }
async function loadList(){
  var d = await call("/api/admin/list", {});
  if(!d) return;
  if(!d.codes.length){ $("list").innerHTML = '<div class="muted">No codes yet.</div>'; return; }
  var h = '<table><tr><th>ID</th><th>Plan</th><th>Note</th><th>Status</th></tr>';
  d.codes.forEach(function(c){
    h += '<tr class="' + (c.used ? "used" : "") + '"><td>' + esc(c.id) + '</td><td>' + esc(c.plan) + "<br>" + esc(c.period) + '</td><td>' + esc(c.label) + '<br><span class="muted">' + esc(dt(c.createdAt)) + '</span></td><td>' +
      (c.used ? '<span class="bad">Used</span><br><span class="muted">' + esc(dt(c.usedAt)) + '</span>' : '<span class="ok">Unused</span>') + '</td></tr>';
  });
  $("list").innerHTML = h + "</table>";
}
var fbData = [];
async function loadFeedback(){
  var d = await call("/api/admin/feedback", {});
  if(!d) return;
  fbData = d.feedback || [];
  renderFb();
}
function renderFb(){
  var f = $("fbFilter").value;
  var up = fbData.filter(function(x){ return x.kind === "up"; }).length;
  var down = fbData.filter(function(x){ return x.kind === "down"; }).length;
  $("fbSummary").textContent = fbData.length + " total: \ud83d\udc4d " + up + " \u00b7 \ud83d\udc4e " + down;
  var list = fbData.filter(function(x){ return f === "all" || x.kind === f; });
  if(!list.length){ $("fbList").innerHTML = '<div class="muted">Nothing here yet.</div>'; return; }
  $("fbList").innerHTML = list.map(function(x){
    return '<div class="card" style="margin:8px 0"><div>' + (x.kind === "up" ? "\ud83d\udc4d" : "\ud83d\udc4e") + ' <span class="muted">' + esc(dt(x.t)) + ' \u00b7 user ' + esc(String(x.uid || "").slice(0, 8)) + '</span></div>' +
      (x.reason ? '<div style="margin:6px 0"><b>' + esc(x.reason) + '</b></div>' : '<div class="muted" style="margin:6px 0">(no reason written)</div>') +
      '<details><summary class="muted">Question and answer</summary><div class="muted" style="margin-top:6px"><b>Question:</b> ' + esc(x.question) + '</div><pre>' + esc(x.answer) + '</pre></details>' +
      '<button class="alt" onclick="delFb(\'' + esc(x.id) + '\')">Delete</button></div>';
  }).join("");
}
async function delFb(id){
  if(!confirm("Delete this feedback?")) return;
  var d = await call("/api/admin/feedback-delete", {id: id});
  if(d){ fbData = fbData.filter(function(x){ return x.id !== id; }); renderFb(); }
}
</script>
</body>
</html>
