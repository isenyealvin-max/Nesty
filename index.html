<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="jfQFLIkbfVxDpRSp1eGfVPuJWENW5KKygw-WCtt0Io8" />
<script>window.onerror=function(m){var b=document.getElementById("boot");if(b)b.textContent="Error: "+m;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nesty AI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:#1a1a1a}
button{font-family:inherit;cursor:pointer}
#boot{padding:40vh 0;text-align:center;color:#777}
#auth{display:none;min-height:100dvh;align-items:center;justify-content:center;padding:20px}
#authCard{width:100%;max-width:360px}
#authLogo{display:block;width:84px;height:84px;border-radius:20px;margin:0 auto 12px;object-fit:cover}
#authCard h1{text-align:center;font-size:28px;margin:0 0 4px}
#authCard p.sub{text-align:center;color:#777;margin:0 0 22px}
#authCard input{width:100%;padding:13px 14px;border:1px solid #d8d8d8;border-radius:10px;font-size:16px;margin-bottom:10px;font-family:inherit}
#aCode{text-align:center;letter-spacing:6px;font-size:22px}
.pbtn{width:100%;padding:13px;border:0;border-radius:10px;background:#1a1a1a;color:#fff;font-size:16px}
.pbtn:disabled{opacity:.6}
.lbtn{width:100%;padding:12px;margin-top:10px;border:1px solid #d8d8d8;border-radius:10px;background:#fff;color:#333;font-size:15px}
.lbtn:disabled{color:#999}
#codeInfo{text-align:center;color:#555;font-size:14px;margin:0 0 14px}
.gbtn{width:100%;padding:12px;border:1px solid #d8d8d8;border-radius:10px;background:#fff;color:#222;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:#999;font-size:13px;margin:14px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:#e5e5e5}
#bootMsg{padding:0 24px}
#bootMsg button{margin-top:14px;padding:11px 22px;border:0;border-radius:10px;background:#1a1a1a;color:#fff;font-size:15px}
#authErr{color:#c62828;font-size:14px;min-height:20px;margin:6px 0}
#authSwitch{text-align:center;margin-top:16px;font-size:14px;color:#555}
#authSwitch a{color:#1a1a1a;font-weight:600;text-decoration:underline}
#app{display:none;flex-direction:column;height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #e8e8e8}
.logo{font-weight:600;font-size:17px}
.hbtn{background:#fff;border:1px solid #d8d8d8;color:#444;padding:6px 11px;border-radius:8px;font-size:13px;margin-left:6px}
.hbtn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
#chat{flex:1;overflow-y:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
#welcome{text-align:center;margin-top:22vh;color:#777;padding:0 10px}
#welcome img{width:72px;height:72px;border-radius:18px;object-fit:cover;margin-bottom:12px}
#welcome h2{color:#1a1a1a;font-weight:500;font-size:24px;margin:0 0 6px}
.msg{margin:18px 0;line-height:1.6;font-size:15.5px;word-wrap:break-word}
.user{background:#f1f1f1;padding:10px 14px;border-radius:16px;max-width:85%;margin-left:auto;width:fit-content;white-space:pre-wrap;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fileTag{display:inline-block;font-size:12px;background:#dedede;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.txt{white-space:normal}
.txt p{margin:0 0 10px}
.txt h2,.txt h3,.txt h4{margin:16px 0 8px;line-height:1.3}
.txt h2{font-size:20px}.txt h3{font-size:17.5px}.txt h4{font-size:16px}
.txt ul,.txt ol{margin:0 0 10px;padding-left:22px}
.txt li{margin:3px 0}
.txt hr{border:0;border-top:1px solid #e3e3e3;margin:14px 0}
.txt blockquote{margin:0 0 10px;padding:4px 12px;border-left:3px solid #d0d0d0;color:#555}
.txt a{color:#1a56db;text-decoration:underline}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid #e3e3e3;border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;min-width:90px}
.tbl th{background:#f5f5f5;font-weight:600;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.txt code{background:#f0f0f0;padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.code{background:#f7f7f7;border:1px solid #e3e3e3;border-radius:10px;margin:10px 0;overflow:hidden}
.codebar{display:flex;justify-content:flex-end;padding:2px 6px;background:#ececec}
.code pre{margin:0;padding:12px;overflow-x:auto;font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.cpbtn{background:none;border:0;color:#555;font-size:13px;padding:6px 8px}
.actions{margin-top:2px}
#inputWrap{max-width:760px;width:100%;margin:0 auto;padding:6px 14px 14px}
#chip{display:none;align-items:center;gap:8px;font-size:13px;background:#f1f1f1;border-radius:8px;padding:6px 10px;margin-bottom:8px;width:fit-content}
#chip button{border:0;background:none;font-size:16px;color:#666}
#bar{display:flex;gap:6px;align-items:flex-end}
.ibtn{width:42px;height:42px;border:1px solid #d8d8d8;background:#fff;border-radius:50%;flex:none;font-size:22px;color:#444;display:flex;align-items:center;justify-content:center;padding:0}
.ibtn.on{background:#e53935;color:#fff;border-color:#e53935}
#send{background:#1a1a1a;color:#fff;border:0;font-weight:bold}
#box{flex:1;resize:none;max-height:140px;background:#fafafa;color:#1a1a1a;border:1px solid #d8d8d8;border-radius:22px;padding:11px 16px;font-size:16px;font-family:inherit;outline:none}
#menu{position:fixed;display:none;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:60;overflow:hidden}
#menu button{display:block;width:150px;padding:13px 16px;text-align:left;background:#fff;border:0;border-bottom:1px solid #f0f0f0;font-size:15px}
#editor{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;align-items:center;justify-content:center;padding:16px}
#editCard{background:#fff;border-radius:14px;padding:14px;width:100%;max-width:500px}
#editBox{width:100%;height:140px;border:1px solid #d8d8d8;border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
#editBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
#editBtns button{padding:9px 16px;border-radius:8px;border:1px solid #d8d8d8;background:#fff;font-size:15px}
#editBtns .go{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
#side{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:85%;background:#f8f8f8;z-index:50;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;border-right:1px solid #e5e5e5}
#side.open{transform:translateX(0)}
#newBtn{margin:14px;padding:12px;border:1px solid #d0d0d0;background:#fff;border-radius:10px;font-size:15px;text-align:left}
#list{flex:1;overflow-y:auto;padding:0 8px}
.item{display:flex;align-items:center;border-radius:8px;margin-bottom:2px}
.item.cur{background:#e9e9e9}
.item .t{flex:1;text-align:left;background:none;border:0;padding:11px 10px;font-size:14.5px;color:#222;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item .x{background:none;border:0;color:#888;font-size:18px;padding:8px 12px}
#empty{color:#999;font-size:14px;padding:10px}
#side .foot{border-top:1px solid #e5e5e5;padding:12px 14px;font-size:13px;color:#666}
#side .foot button{margin-top:8px;width:100%;padding:10px;border:1px solid #d0d0d0;background:#fff;border-radius:8px;font-size:14px}
#toast{display:none;position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:90%}
</style>
</head>
<body>

<div id="boot">Loading...</div>

<div id="auth">
  <div id="authCard">
    <img id="authLogo" src="/icon-192.png" alt="Nesty AI">
    <h1>Nesty AI</h1>
    <p class="sub" id="authSub">Welcome back</p>

    <div id="stepForm">
      <input id="aFirst" placeholder="First name" style="display:none" autocomplete="given-name">
      <input id="aLast" placeholder="Second name" style="display:none" autocomplete="family-name">
      <input id="aEmail" type="email" placeholder="Email" autocomplete="email">
      <button class="pbtn" id="sendBtn" onclick="sendCode()">Send code</button>
      <div class="or">or</div>
      <button class="gbtn" onclick="googleLogin()"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</button>
      <div id="authSwitch"></div>
    </div>

    <div id="stepCode" style="display:none">
      <p id="codeInfo"></p>
      <input id="aCode" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="one-time-code">
      <button class="pbtn" id="verifyBtn" onclick="verifyCode()">Verify</button>
      <button class="lbtn" id="resendBtn" onclick="resendCode()">Resend code</button>
      <button class="lbtn" onclick="backToForm()">Change email</button>
    </div>

    <div id="authErr"></div>
  </div>
</div>

<div id="app">
  <header>
    <button class="hbtn" style="margin-left:0" onclick="openSide()">&#9776;</button>
    <div class="logo">Nesty AI</div>
    <div>
      <button class="hbtn" id="spk" onclick="toggleSpeak()">Voice: Off</button>
      <button class="hbtn" onclick="newChat()">+ New</button>
    </div>
  </header>
  <div id="chat"></div>
  <div id="inputWrap">
    <div id="chip"><span id="chipName"></span><button onclick="removeFile()">&times;</button></div>
    <div id="bar">
      <button class="ibtn" onclick="document.getElementById('file').click()">+</button>
      <textarea id="box" rows="1" placeholder="Message Nesty"></textarea>
      <button class="ibtn" id="mic" onclick="toggleMic()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
      <button class="ibtn" id="send" onclick="send()">&#8593;</button>
    </div>
    <input type="file" id="file" style="display:none" accept=".txt,.md,.csv,.json,.js,.html,.css,.py,.java,.c,.cpp,.xml,.log">
  </div>
</div>

<div id="overlay" onclick="closeSide()"></div>
<div id="side">
  <button id="newBtn" onclick="newChat()">+ New chat</button>
  <div id="list"></div>
  <div class="foot">
    <div id="who"></div>
    <button id="installBtn" style="display:none" onclick="installApp()">Install Nesty app</button>
    <button onclick="logout()">Log out</button>
  </div>
</div>

<div id="menu">
  <button onclick="menuEdit()">Edit</button>
  <button onclick="menuCopy()">Copy text</button>
  <button onclick="menuDelete()" style="border-bottom:0;color:#c62828">Delete</button>
</div>

<div id="editor">
  <div id="editCard">
    <textarea id="editBox"></textarea>
    <div id="editBtns">
      <button onclick="closeEditor()">Cancel</button>
      <button class="go" onclick="saveEdit()">Send</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var ENDPOINT = "https://sgp.cloud.appwrite.io/v1";
var PROJECT = "6adc585d003ae0c1be08";
var DB = "6adc5cb4000ae3ae60c6";
var TABLE = "6adc5cc5002aa37421a9";

var client = new Appwrite.Client().setEndpoint(ENDPOINT).setProject(PROJECT);
var account = new Appwrite.Account(client);
var db = new Appwrite.Databases(client);
var ID = Appwrite.ID, Query = Appwrite.Query, Permission = Appwrite.Permission, Role = Appwrite.Role;

var user = null;
var messages = [];
var chats = [];
var chatId = null;
var loading = false;
var pendingFile = null;
var speakOn = false;
var voiceTurn = false;
var menuIdx = -1;
var editIdx = -1;

var authMode = "signin";
var authUserId = null;
var authEmail = "";
var pendFirst = "";
var pendLast = "";
var resendTimer = null;
var installEvent = null;

var chat = document.getElementById("chat");
var box = document.getElementById("box");
var menu = document.getElementById("menu");

function $(id){ return document.getElementById(id); }

function toast(t){
  var e = $("toast");
  e.textContent = t;
  e.style.display = "block";
  setTimeout(function(){ e.style.display = "none"; }, 4000);
}

/* ---------- Install as app ---------- */
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  installEvent = e;
  $("installBtn").style.display = "block";
});
window.addEventListener("appinstalled", function(){
  installEvent = null;
  $("installBtn").style.display = "none";
});
async function installApp(){
  if(!installEvent) return;
  installEvent.prompt();
  try{ await installEvent.userChoice; }catch(e){}
  installEvent = null;
  $("installBtn").style.display = "none";
}
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
}

/* ---------- Account (email code, no password) ---------- */
function drawAuth(){
  var su = authMode === "signup";
  $("aFirst").style.display = su ? "block" : "none";
  $("aLast").style.display = su ? "block" : "none";
  $("authSub").textContent = su ? "Create your account" : "Welcome back";
  $("authSwitch").innerHTML = su
    ? 'Already have an account? <a href="#" onclick="switchAuth();return false">Sign in</a>'
    : 'New here? <a href="#" onclick="switchAuth();return false">Create account</a>';
  $("authErr").textContent = "";
  $("stepForm").style.display = "block";
  $("stepCode").style.display = "none";
}
function switchAuth(){
  authMode = authMode === "signup" ? "signin" : "signup";
  drawAuth();
}
function backToForm(){
  clearInterval(resendTimer);
  drawAuth();
}

function showAuth(){
  clearInterval(resendTimer);
  $("boot").style.display = "none";
  $("app").style.display = "none";
  $("auth").style.display = "flex";
  drawAuth();
}
function showApp(){
  $("boot").style.display = "none";
  $("auth").style.display = "none";
  $("app").style.display = "flex";
  $("who").textContent = user.email;
  newChat();
  loadList();
}

function firstName(){
  if(!user) return "";
  var p = user.prefs || {};
  if(p.firstName) return p.firstName;
  return (user.name || "").split(" ")[0];
}

async function sendCode(){
  var email = $("aEmail").value.trim().toLowerCase();
  if(authMode === "signup"){
    pendFirst = $("aFirst").value.trim();
    pendLast = $("aLast").value.trim();
    if(!pendFirst || !pendLast){ $("authErr").textContent = "Enter your first name and second name."; return; }
  }
  if(!email || email.indexOf("@") < 1){ $("authErr").textContent = "Enter a valid email."; return; }
  $("sendBtn").disabled = true;
  $("authErr").textContent = "";
  try{
    var t = await account.createEmailToken(ID.unique(), email);
    authUserId = t.userId;
    authEmail = email;
    $("codeInfo").textContent = "We sent a 6-digit code to " + email + ". Check your spam folder too.";
    $("aCode").value = "";
    $("stepForm").style.display = "none";
    $("stepCode").style.display = "block";
    startTimer();
    $("aCode").focus();
  }catch(e){
    $("authErr").textContent = e.message || "Could not send the code.";
  }
  $("sendBtn").disabled = false;
}

function startTimer(){
  clearInterval(resendTimer);
  var end = Date.now() + 120000;
  var b = $("resendBtn");
  b.disabled = true;
  function tick(){
    var s = Math.ceil((end - Date.now()) / 1000);
    if(s <= 0){
      clearInterval(resendTimer);
      b.disabled = false;
      b.textContent = "Resend code";
      return;
    }
    b.textContent = "Resend code in " + Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }
  tick();
  resendTimer = setInterval(tick, 1000);
}

async function resendCode(){
  $("resendBtn").disabled = true;
  $("authErr").textContent = "";
  try{
    var t = await account.createEmailToken(authUserId, authEmail);
    authUserId = t.userId;
    startTimer();
    toast("New code sent.");
  }catch(e){
    $("authErr").textContent = e.message || "Could not resend the code.";
    $("resendBtn").disabled = false;
  }
}

async function verifyCode(){
  var code = $("aCode").value.replace(/\s/g, "");
  if(code.length < 6){ $("authErr").textContent = "Enter the 6-digit code."; return; }
  $("verifyBtn").disabled = true;
  $("authErr").textContent = "";
  try{
    try{ await account.deleteSession("current"); }catch(e){}
    await account.createSession(authUserId, code);
    user = await account.get();

    if(authMode === "signup"){
      if(!user.name){
        await account.updateName(pendFirst + " " + pendLast);
        await account.updatePrefs({firstName: pendFirst, lastName: pendLast});
        user = await account.get();
      }
    }else{
      if(!user.name){
        try{ await account.deleteSession("current"); }catch(e){}
        user = null;
        drawAuth();
        $("authErr").textContent = "No account found for this email. Please create an account first.";
        $("verifyBtn").disabled = false;
        return;
      }
    }
    clearInterval(resendTimer);
    showApp();
  }catch(e){
    $("authErr").textContent = e.message || "The code is wrong or expired.";
  }
  $("verifyBtn").disabled = false;
}

async function logout(){
  try{ await account.deleteSession("current"); }catch(e){}
  user = null;
  messages = [];
  chats = [];
  chatId = null;
  closeSide();
  authMode = "signin";
  showAuth();
}

function showConnectError(){
  $("auth").style.display = "none";
  $("app").style.display = "none";
  var b = $("boot");
  b.style.display = "block";
  b.innerHTML = '<div id="bootMsg">Cannot connect to Nesty right now.<br>Check your internet and try again.<br><button onclick="location.reload()">Retry</button></div>';
}

function googleLogin(){
  $("authErr").textContent = "";
  try{
    var prov = (Appwrite.OAuthProvider && Appwrite.OAuthProvider.Google) ? Appwrite.OAuthProvider.Google : "google";
    account.createOAuth2Token(prov, location.origin + "/", location.origin + "/?oauth=failed");
  }catch(e){
    $("authErr").textContent = e.message || "Could not start Google sign-in.";
  }
}

async function init(){
  var qs = new URLSearchParams(location.search);
  var uid = qs.get("userId"), sec = qs.get("secret");
  if(uid && sec){
    try{
      try{ await account.deleteSession("current"); }catch(e){}
      await account.createSession(uid, sec);
      user = await account.get();
      history.replaceState(null, "", "/");
      showApp();
      return;
    }catch(e){
      history.replaceState(null, "", "/");
      showAuth();
      $("authErr").textContent = (e && e.message) || "Google sign-in failed. Please try again.";
      return;
    }
  }
  if(qs.get("oauth") === "failed"){
    history.replaceState(null, "", "/");
    showAuth();
    $("authErr").textContent = "Google sign-in was cancelled or failed. Please try again.";
    return;
  }
  try{
    user = await account.get();
    showApp();
  }catch(e){
    if(e && (e.code === 401 || e.code === 403)){
      showAuth();
    }else{
      showConnectError();
    }
  }
}

/* ---------- Saved chats ---------- */
function chatTitle(){
  for(var i = 0; i < messages.length; i++){
    if(messages[i].role === "user" && messages[i].text){
      var t = messages[i].text.replace(/\s+/g, " ").trim();
      return t.length > 40 ? t.slice(0, 40) + "..." : t;
    }
  }
  return "New chat";
}

async function saveChat(){
  if(!user) return;
  if(!messages.length && !chatId) return;
  try{
    if(!chatId){
      var perms = [
        Permission.read(Role.user(user.$id)),
        Permission.update(Role.user(user.$id)),
        Permission.delete(Role.user(user.$id))
      ];
      var row = await db.createDocument(DB, TABLE, ID.unique(),
        {userId: user.$id, Title: chatTitle(), messages: JSON.stringify(messages)}, perms);
      chatId = row.$id;
    }else{
      await db.updateDocument(DB, TABLE, chatId, {messages: JSON.stringify(messages)});
    }
    loadList();
  }catch(e){
    toast("Could not save chat: " + (e.message || "error"));
  }
}

async function loadList(){
  try{
    var r = await db.listDocuments(DB, TABLE, [Query.orderDesc("$updatedAt"), Query.limit(50)]);
    chats = r.documents;
    renderList();
  }catch(e){
    toast("Could not load chats: " + (e.message || "error"));
  }
}

function renderList(){
  var list = $("list");
  list.innerHTML = "";
  if(!chats.length){
    var em = document.createElement("div");
    em.id = "empty";
    em.textContent = "No saved chats yet.";
    list.appendChild(em);
    return;
  }
  chats.forEach(function(c){
    var it = document.createElement("div");
    it.className = "item" + (c.$id === chatId ? " cur" : "");
    var t = document.createElement("button");
    t.className = "t";
    t.textContent = c.Title || "Chat";
    t.onclick = function(){ openChat(c.$id); };
    var x = document.createElement("button");
    x.className = "x";
    x.innerHTML = "&times;";
    x.onclick = function(){ removeChat(c.$id); };
    it.appendChild(t);
    it.appendChild(x);
    list.appendChild(it);
  });
}

function openChat(id){
  var c = chats.filter(function(r){ return r.$id === id; })[0];
  if(!c) return;
  try{ messages = JSON.parse(c.messages || "[]"); }catch(e){ messages = []; }
  chatId = id;
  if(window.speechSynthesis) speechSynthesis.cancel();
  renderAll();
  renderList();
  closeSide();
}

async function removeChat(id){
  if(!confirm("Delete this chat?")) return;
  try{
    await db.deleteDocument(DB, TABLE, id);
    if(id === chatId){ messages = []; chatId = null; renderAll(); }
    loadList();
  }catch(e){
    toast("Could not delete: " + (e.message || "error"));
  }
}

function openSide(){
  $("side").classList.add("open");
  $("overlay").style.display = "block";
  loadList();
}
function closeSide(){
  $("side").classList.remove("open");
  $("overlay").style.display = "none";
}

/* ---------- Chat display ---------- */
box.addEventListener("input", function(){
  box.style.height = "auto";
  box.style.height = box.scrollHeight + "px";
});

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function inline(s){
  return esc(s).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
}

function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<i>$2</i>");
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function mdToHtml(src){
  var lines = src.split("\n");
  var out = [];
  var i = 0;
  function isSep(l){
    return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.indexOf("-") > -1 && l.indexOf("|") > -1;
  }
  function cells(l){
    l = l.trim();
    if(l.charAt(0) === "|") l = l.slice(1);
    if(l.charAt(l.length - 1) === "|") l = l.slice(0, -1);
    return l.split("|").map(function(c){ return c.trim(); });
  }
  function isUl(l){ return /^\s*[-*+]\s+/.test(l); }
  function isOl(l){ return /^\s*\d+[.)]\s+/.test(l); }
  function startsBlock(l, nxt){
    return /^#{1,6}\s+/.test(l) || isUl(l) || isOl(l) || /^\s*>/.test(l) ||
      /^\s*([-*_])\1{2,}\s*$/.test(l) || (l.indexOf("|") > -1 && nxt !== undefined && isSep(nxt));
  }
  while(i < lines.length){
    var l = lines[i];
    if(!l.trim()){ i++; continue; }
    var m = l.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      var lv = Math.min(m[1].length, 3) + 1;
      out.push("<h" + lv + ">" + mdInline(m[2]) + "</h" + lv + ">");
      i++; continue;
    }
    if(/^\s*([-*_])\1{2,}\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(l.indexOf("|") > -1 && i + 1 < lines.length && isSep(lines[i + 1])){
      var head = cells(l);
      i += 2;
      var rows = [];
      while(i < lines.length && lines[i].trim() && lines[i].indexOf("|") > -1){
        rows.push(cells(lines[i]));
        i++;
      }
      var h = "<div class=\"tbl\"><table><thead><tr>";
      head.forEach(function(c){ h += "<th>" + mdInline(c) + "</th>"; });
      h += "</tr></thead><tbody>";
      rows.forEach(function(r){
        h += "<tr>";
        for(var k = 0; k < head.length; k++){ h += "<td>" + mdInline(r[k] || "") + "</td>"; }
        h += "</tr>";
      });
      h += "</tbody></table></div>";
      out.push(h);
      continue;
    }
    if(/^\s*>/.test(l)){
      var q = [];
      while(i < lines.length && /^\s*>/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote>" + q.map(mdInline).join("<br>") + "</blockquote>");
      continue;
    }
    if(isUl(l) || isOl(l)){
      var ord = isOl(l);
      var items = [];
      while(i < lines.length && (ord ? isOl(lines[i]) : isUl(lines[i]))){
        items.push(lines[i].replace(ord ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/, ""));
        i++;
      }
      var tag = ord ? "ol" : "ul";
      out.push("<" + tag + ">" + items.map(function(it){ return "<li>" + mdInline(it) + "</li>"; }).join("") + "</" + tag + ">");
      continue;
    }
    var para = [l];
    i++;
    while(i < lines.length && lines[i].trim() && !startsBlock(lines[i], lines[i + 1])){
      para.push(lines[i]);
      i++;
    }
    out.push("<p>" + para.map(mdInline).join("<br>") + "</p>");
  }
  return out.join("");
}

function copyText(text, btn){
  function done(){
    if(!btn) return;
    var old = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(function(){ btn.textContent = old; }, 1500);
  }
  function fallback(){
    var t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try{ document.execCommand("copy"); }catch(e){}
    t.remove();
    done();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else{
    fallback();
  }
}

function apiContent(m){
  if(m.file){
    return "[Attached file: " + m.file.name + "]\n" + m.file.text + "\n[End of file]\n\n" + m.text;
  }
  return m.text;
}

function buildUser(m, i){
  var d = document.createElement("div");
  d.className = "msg user";
  if(m.file){
    var tag = document.createElement("span");
    tag.className = "fileTag";
    tag.textContent = m.file.name;
    d.appendChild(tag);
    d.appendChild(document.createElement("br"));
  }
  d.appendChild(document.createTextNode(m.text));

  var timer = null, sx = 0, sy = 0;
  d.addEventListener("pointerdown", function(e){
    sx = e.clientX; sy = e.clientY;
    timer = setTimeout(function(){ showMenu(i, sx, sy); }, 450);
  });
  function cancel(){ clearTimeout(timer); }
  d.addEventListener("pointerup", cancel);
  d.addEventListener("pointercancel", cancel);
  d.addEventListener("pointermove", function(e){
    if(Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel();
  });
  d.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  return d;
}

function buildBot(m){
  var d = document.createElement("div");
  d.className = "msg bot";
  var parts = m.content.split("```");
  for(var i = 0; i < parts.length; i++){
    if(i % 2 === 1){
      var code = parts[i];
      var nl = code.indexOf("\n");
      if(nl > -1 && nl <= 15 && code.slice(0, nl).trim().indexOf(" ") === -1){
        code = code.slice(nl + 1);
      }
      code = code.replace(/\n+$/,"");
      var wrap = document.createElement("div");
      wrap.className = "code";
      var bar = document.createElement("div");
      bar.className = "codebar";
      var cb = document.createElement("button");
      cb.className = "cpbtn";
      cb.textContent = "Copy";
      (function(c, b){ b.onclick = function(){ copyText(c, b); }; })(code, cb);
      bar.appendChild(cb);
      var pre = document.createElement("pre");
      pre.textContent = code;
      wrap.appendChild(bar);
      wrap.appendChild(pre);
      d.appendChild(wrap);
    }else{
      var t = parts[i].replace(/^\n+|\n+$/g,"");
      if(!t) continue;
      var tx = document.createElement("div");
      tx.className = "txt";
      tx.innerHTML = mdToHtml(t);
      d.appendChild(tx);
    }
  }
  var act = document.createElement("div");
  act.className = "actions";
  var cp = document.createElement("button");
  cp.className = "cpbtn";
  cp.textContent = "Copy";
  cp.onclick = function(){ copyText(m.content, cp); };
  act.appendChild(cp);
  d.appendChild(act);
  return d;
}

function renderAll(){
  chat.innerHTML = "";
  if(!messages.length && !loading){
    var n = firstName();
    var title = n ? "Hello " + esc(n) + ", how are you doing?" : "What can I help with?";
    var sub = n ? "What can I help you with today?" : "Ask me anything.";
    chat.innerHTML = '<div id="welcome"><img src="/icon-192.png" alt=""><h2>' + title + '</h2><div>' + sub + '</div></div>';
    return;
  }
  for(var i = 0; i < messages.length; i++){
    var m = messages[i];
    chat.appendChild(m.role === "user" ? buildUser(m, i) : buildBot(m));
  }
  if(loading){
    var w = document.createElement("div");
    w.className = "msg bot";
    w.textContent = "Thinking...";
    chat.appendChild(w);
  }
  chat.scrollTop = chat.scrollHeight;
}

async function ask(){
  loading = true;
  renderAll();
  var reply;
  try{
    var res = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        userName: firstName(),
        messages: messages.map(function(m){
          return {role: m.role, content: m.role === "user" ? apiContent(m) : m.content};
        })
      })
    });
    var data = await res.json();
    reply = data.reply || "Sorry, something went wrong.";
  }catch(e){
    reply = "Network error. Please try again.";
  }
  loading = false;
  messages.push({role:"assistant", content:reply});
  renderAll();
  if(speakOn || voiceTurn) speak(reply);
  voiceTurn = false;
  saveChat();
}

function send(){
  if(loading) return;
  var text = box.value.trim();
  if(!text && !pendingFile) return;
  if(!text) text = "Please read this file.";
  messages.push({role:"user", text:text, file:pendingFile});
  box.value = "";
  box.style.height = "auto";
  removeFile();
  ask();
}

function newChat(){
  messages = [];
  chatId = null;
  if(window.speechSynthesis) speechSynthesis.cancel();
  renderAll();
  renderList();
  closeSide();
}

/* ---------- Long-press menu ---------- */
function showMenu(i, x, y){
  menuIdx = i;
  menu.style.display = "block";
  menu.style.left = Math.min(x, window.innerWidth - 160) + "px";
  menu.style.top = Math.min(y + 10, window.innerHeight - 170) + "px";
}
function hideMenu(){ menu.style.display = "none"; }
document.addEventListener("pointerdown", function(e){
  if(!menu.contains(e.target)) hideMenu();
});
function menuCopy(){
  copyText(messages[menuIdx].text, null);
  hideMenu();
}
function menuDelete(){
  var n = (messages[menuIdx + 1] && messages[menuIdx + 1].role === "assistant") ? 2 : 1;
  messages.splice(menuIdx, n);
  hideMenu();
  renderAll();
  saveChat();
}
function menuEdit(){
  editIdx = menuIdx;
  $("editBox").value = messages[editIdx].text;
  $("editor").style.display = "flex";
  hideMenu();
}
function closeEditor(){ $("editor").style.display = "none"; }
function saveEdit(){
  var t = $("editBox").value.trim();
  if(!t) return;
  messages[editIdx].text = t;
  messages = messages.slice(0, editIdx + 1);
  closeEditor();
  ask();
}

/* ---------- File attach ---------- */
var fileInput = $("file");
fileInput.addEventListener("change", function(){
  var f = fileInput.files[0];
  if(!f) return;
  if(f.type.indexOf("image/") === 0 || f.type === "application/pdf"){
    alert("Pictures and PDFs are not supported yet. Use a text file.");
    fileInput.value = "";
    return;
  }
  if(f.size > 1000000){
    alert("File is too big (max 1 MB).");
    fileInput.value = "";
    return;
  }
  var r = new FileReader();
  r.onload = function(){
    var t = r.result;
    if(t.length > 12000){ t = t.slice(0, 12000) + "\n...[file cut because it is long]"; }
    pendingFile = {name: f.name, text: t};
    $("chipName").textContent = f.name;
    $("chip").style.display = "flex";
  };
  r.readAsText(f);
  fileInput.value = "";
});
function removeFile(){
  pendingFile = null;
  $("chip").style.display = "none";
}

/* ---------- Voice ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false;
var micBtn = $("mic");

function toggleMic(){
  if(!SR){ alert("Voice input is not supported in this browser."); return; }
  if(listening){ rec.stop(); return; }
  rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.onstart = function(){ listening = true; micBtn.classList.add("on"); };
  rec.onend = function(){ listening = false; micBtn.classList.remove("on"); };
  rec.onerror = function(ev){ listening = false; micBtn.classList.remove("on"); toast("Mic problem: " + ((ev && ev.error) || "unknown")); };
  rec.onresult = function(e){
    box.value = e.results[0][0].transcript;
    voiceTurn = true;
    send();
  };
  rec.start();
}

function toggleSpeak(){
  speakOn = !speakOn;
  var b = $("spk");
  b.textContent = "Voice: " + (speakOn ? "On" : "Off");
  b.classList.toggle("on", speakOn);
  if(!speakOn && window.speechSynthesis) speechSynthesis.cancel();
}
function speak(text){
  if(!window.speechSynthesis) return;
  var clean = text.replace(/```[\s\S]*?```/g, " code block ").replace(/[*`#]/g, "");
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(clean));
}

init();
</script>
