<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="jfQFLIkbfVxDpRSp1eGfVPuJWENW5KKygw-WCtt0Io8" />
<script>window.onerror=function(m){var b=document.getElementById("boot");if(b)b.textContent="Error: "+m;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nesty AI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
<style>
:root{--bg:#ffffff;--text:#1a1a1a;--muted:#6b6b6b;--card:#ffffff;--soft:#f0f0f0;--soft2:#e6e6e6;--border:#d8d8d8;--side:#f8f8f8;--btn:#1a1a1a;--btnText:#ffffff;--link:#1a56db}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button{font-family:inherit;cursor:pointer}
#boot{padding:40vh 0;text-align:center;color:var(--muted)}
#auth{display:none;min-height:100dvh;align-items:center;justify-content:center;padding:20px}
#authCard{width:100%;max-width:360px}
#authLogo{display:block;width:84px;height:84px;border-radius:20px;margin:0 auto 12px;object-fit:cover}
#authCard h1{text-align:center;font-size:28px;margin:0 0 4px}
#authCard p.sub{text-align:center;color:var(--muted);margin:0 0 22px}
#authCard input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:10px;font-family:inherit;background:var(--card);color:var(--text)}
#aCode{text-align:center;letter-spacing:6px;font-size:22px}
.pbtn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--btn);color:var(--btnText);font-size:16px}
.pbtn:disabled{opacity:.6}
.lbtn{width:100%;padding:12px;margin-top:10px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:15px}
.lbtn:disabled{color:var(--muted)}
#codeInfo{text-align:center;color:var(--muted);font-size:14px;margin:0 0 14px}
.gbtn{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--border)}
#bootMsg{padding:0 24px}
#bootMsg button{margin-top:14px;padding:11px 22px;border:0;border-radius:10px;background:var(--btn);color:var(--btnText);font-size:15px}
.legal{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.legal a{color:var(--muted);text-decoration:underline}
#verAuth{margin-top:6px}
#limitBar{display:none;background:#fff4e5;border:1px solid #ffd9a0;color:#7a4a00;border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:8px}
#side .links{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
#side .links a{color:var(--muted)}
#authErr{color:#e53935;font-size:14px;min-height:20px;margin:6px 0}
#authSwitch{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
#authSwitch a{color:var(--text);font-weight:600;text-decoration:underline}
#app{display:none;flex-direction:column;height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
.logo{font-weight:600;font-size:17px}
.hbtn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:8px;font-size:13px;margin-left:6px}
.hbtn.on{background:var(--btn);color:var(--btnText);border-color:var(--btn)}
#chat{flex:1;overflow-y:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
#welcome{text-align:center;margin-top:22vh;color:var(--muted);padding:0 10px}
#welcome img{width:72px;height:72px;border-radius:18px;object-fit:cover;margin-bottom:12px}
#welcome h2{color:var(--text);font-weight:500;font-size:24px;margin:0 0 6px}
.msg{margin:18px 0;line-height:1.6;font-size:15.5px;word-wrap:break-word}
.user{background:var(--soft);padding:10px 14px;border-radius:16px;max-width:85%;margin-left:auto;width:fit-content;white-space:pre-wrap;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fileTag{display:inline-block;font-size:12px;background:var(--soft2);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.txt{white-space:normal}
.txt p{margin:0 0 10px}
.txt h2,.txt h3,.txt h4{margin:16px 0 8px;line-height:1.3}
.txt h2{font-size:20px}.txt h3{font-size:17.5px}.txt h4{font-size:16px}
.txt ul,.txt ol{margin:0 0 10px;padding-left:22px}
.txt li{margin:3px 0}
.txt hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.txt blockquote{margin:0 0 10px;padding:4px 12px;border-left:3px solid var(--border);color:var(--muted)}
.txt a{color:var(--link);text-decoration:underline}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--border);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;min-width:90px}
.tbl th{background:var(--soft);font-weight:600;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.txt code{background:var(--soft2);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.code{background:var(--soft);border:1px solid var(--border);border-radius:10px;margin:10px 0;overflow:hidden}
.codebar{display:flex;justify-content:flex-end;padding:2px 6px;background:var(--soft2)}
.code pre{margin:0;padding:12px;overflow-x:auto;font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre;direction:ltr;text-align:left}
.cpbtn{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 8px}
.actions{margin-top:2px}
#inputWrap{max-width:760px;width:100%;margin:0 auto;padding:6px 14px 14px}
#chip{display:none;align-items:center;gap:8px;font-size:13px;background:var(--soft);border-radius:8px;padding:6px 10px;margin-bottom:8px;width:fit-content}
#chip button{border:0;background:none;font-size:16px;color:var(--muted)}
#bar{display:flex;gap:6px;align-items:flex-end}
.ibtn{width:42px;height:42px;border:1px solid var(--border);background:var(--card);border-radius:50%;flex:none;font-size:22px;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}
.ibtn.on{background:#e53935;color:#fff;border-color:#e53935}
#send{background:var(--btn);color:var(--btnText);border:0;font-weight:bold}
#box{flex:1;resize:none;max-height:140px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:22px;padding:11px 16px;font-size:16px;font-family:inherit;outline:none}
#menu{position:fixed;display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;overflow:hidden}
#menu button{display:block;width:150px;padding:13px 16px;text-align:start;background:var(--card);color:var(--text);border:0;border-bottom:1px solid var(--border);font-size:15px}
#editor{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;align-items:center;justify-content:center;padding:16px}
#editCard{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:500px}
#editBox{width:100%;height:140px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:16px;font-family:inherit;background:var(--card);color:var(--text)}
#editBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
#editBtns button{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px}
#editBtns .go{background:var(--btn);color:var(--btnText);border-color:var(--btn)}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
#side{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:85%;background:var(--side);z-index:50;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;border-right:1px solid var(--border)}
#side.open{transform:translateX(0)}
#newBtn{margin:14px;padding:12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;font-size:15px;text-align:start}
#list{flex:1;overflow-y:auto;padding:0 8px}
.item{display:flex;align-items:center;border-radius:8px;margin-bottom:2px}
.item.cur{background:var(--soft2)}
.item .t{flex:1;text-align:start;background:none;border:0;padding:11px 10px;font-size:14.5px;color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item .x{background:none;border:0;color:var(--muted);font-size:18px;padding:8px 12px}
#empty{color:var(--muted);font-size:14px;padding:10px}
#side .foot{border-top:1px solid var(--border);padding:12px 14px;font-size:13px;color:var(--muted)}
#side .foot button{margin-top:8px;width:100%;padding:10px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;font-size:14px}
#toast{display:none;position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btnText);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:90%}
.thumb{display:block;max-width:220px;max-height:220px;border-radius:10px;margin-bottom:6px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.sugs button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:18px;padding:8px 14px;font-size:14px}
#q{margin:0 14px 10px;width:calc(100% - 28px);padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text)}
#side .prof{display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:6px}
#side .pt{min-width:0}
#sideName{font-weight:600;color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#settings{display:none;position:fixed;inset:0;background:var(--bg);z-index:75;overflow-y:auto}
#settings .in{max-width:520px;margin:0 auto;padding:14px 18px 50px}
#settings .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#settings .bar h2{margin:0;font-size:20px}
#settings .sec{border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
#settings .sec h3{margin:0 0 10px;font-size:15px;color:var(--muted)}
#settings input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:8px;font-family:inherit;background:var(--card);color:var(--text)}
#settings .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sbtn{padding:10px 14px;border:1px solid var(--border);background:var(--card);border-radius:10px;font-size:14px;color:var(--text)}
.sbtn.dark{background:var(--btn);color:var(--btnText);border-color:var(--btn)}
.sbtn.red{color:#e53935;border-color:#e8b4b4}
#avBig{margin:0 auto 10px}
#sMsg{color:#43a047;font-size:14px;min-height:20px}
.muted2{color:var(--muted);font-size:13.5px;margin:4px 0 8px}
#modeRow{display:flex;justify-content:flex-start;margin-bottom:6px;gap:8px}
#webBtn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:14px;padding:4px 11px;font-size:12.5px}
#webBtn.on{background:#1a56db;border-color:#1a56db;color:#fff}
#webBtn.off{opacity:.65}
.src{margin:8px 0 2px;font-size:12.5px;color:var(--muted);line-height:1.7}
.src a{display:inline-block;margin:0 6px 4px 0;padding:2px 9px;border:1px solid var(--border);border-radius:12px;color:var(--text);text-decoration:none;background:var(--card)}
#imgBtn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:14px;padding:4px 11px;font-size:12.5px}
#imgBtn.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.gimg{display:block;max-width:100%;width:420px;border-radius:12px;border:1px solid var(--border);margin-bottom:6px}
.gnote{color:var(--muted);font-size:14px}
#updateBar{display:none;position:fixed;top:0;left:0;right:0;background:#1a56db;color:#fff;text-align:center;padding:12px;font-size:14px;z-index:90;cursor:pointer}
.sel{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--card);color:var(--text);font-family:inherit}
#aLang{margin-top:14px}
#sInstr{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:8px;font-family:inherit;resize:vertical;background:var(--card);color:var(--text)}
.memItem{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--soft);border-radius:8px;margin-bottom:6px;font-size:14.5px}
.memItem button{border:0;background:none;font-size:18px;color:var(--muted)}
#swatches{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);padding:0}
.sw.on{outline:3px solid #1a56db;outline-offset:2px}
.customBg{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
#bgPick{width:44px;height:34px;border:0;padding:0;background:none}
#sMsg{position:sticky;top:0;z-index:2;background:var(--bg)}
#settings input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:8px;font-family:inherit;background:var(--card);color:var(--text)}
.hbtn.up{background:#1a56db;color:#fff;border-color:#1a56db}
.hbtn.plan{border-color:#7c3aed;color:#7c3aed}
#promoBar{display:none;position:relative;background:#eef4ff;border:1px solid #b9d0ff;color:#173b8f;border-radius:10px;padding:10px 34px 10px 12px;font-size:14px;margin-bottom:8px}
#promoBar .x{position:absolute;top:2px;right:6px;border:0;background:none;font-size:20px;color:inherit}
.upRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.upRow button{padding:7px 12px;border-radius:8px;border:1px solid #1a56db;background:#fff;color:#1a56db;font-size:13px;font-weight:600}
#limitBar .upRow button{border-color:#7a4a00;color:#7a4a00}
#plans{display:none;position:fixed;inset:0;background:var(--bg);z-index:76;overflow-y:auto}
#plans .in{max-width:520px;margin:0 auto;padding:14px 18px 50px}
.pcard{border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0;background:var(--card)}
.pcard.cur{border-color:#1a56db}
.pcard.focus{outline:3px solid #7c3aed}
.pcard h3{margin:0 0 4px;font-size:17px}
.pcard .price{font-size:14px;color:var(--muted);margin-bottom:6px}
.pcard ul,.pcard ol{margin:6px 0 0;padding-left:22px;font-size:14.5px}
#actMsg.ok{color:#43a047}
#actMsg.bad{color:#e53935}
#actCode{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:16px;letter-spacing:2px;text-transform:uppercase;margin:8px 0;background:var(--card);color:var(--text);font-family:inherit}
</style>
</head>
<body>

<div id="boot">Loading...</div>

<div id="auth">
  <div id="authCard">
    <img id="authLogo" src="/icon-192.png" alt="Nesty AI">
    <h1>Nesty AI</h1>
    <p class="sub" id="authSub"></p>

    <div id="stepForm">
      <input id="aName" data-ph="a_name" style="display:none" autocomplete="name">
      <input id="aAge" type="number" inputmode="numeric" min="13" max="120" data-ph="a_age" style="display:none">
      <input id="aEmail" type="email" data-ph="a_email" autocomplete="email">
      <input id="aPass" type="password" data-ph="a_pass" autocomplete="current-password">
      <input id="aPass2" type="password" data-ph="a_pass2" style="display:none" autocomplete="new-password">
      <button class="pbtn" id="sendBtn" onclick="submitAuth()"></button>
      <button class="lbtn" id="codeLoginBtn" onclick="emailCodeLogin()"></button>
      <div class="or" data-i="a_or"></div>
      <button class="gbtn" onclick="googleLogin()"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span data-i="a_google"></span></button>
      <button class="gbtn" id="fbBtn" style="margin-top:10px;display:none" onclick="facebookLogin()"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.88v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>Continue with Facebook</button>
      <div id="authSwitch"></div>
    </div>

    <div id="stepCode" style="display:none">
      <p id="codeInfo"></p>
      <input id="aCode" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="one-time-code">
      <button class="pbtn" id="verifyBtn" onclick="verifyCode()" data-i="a_verify"></button>
      <button class="lbtn" id="resendBtn" onclick="resendCode()"></button>
      <button class="lbtn" onclick="backToForm()" data-i="a_change"></button>
    </div>

    <div id="authErr"></div>
    <select id="aLang" class="sel" onchange="setUiLang(this.value)"></select>
    <div class="legal" id="legal"></div>
    <div class="legal" id="verAuth"></div>
  </div>
</div>

<div id="app">
  <header>
    <div><button class="hbtn" style="margin-left:0" onclick="openSide()">&#9776;</button><button class="hbtn" id="planBtn" onclick="openPlans()"></button></div>
    <div class="logo">Nesty AI</div>
    <div>
      <button class="hbtn" id="spk" onclick="toggleSpeak()"></button>
      <button class="hbtn" onclick="newChat()" data-i="new"></button>
    </div>
  </header>
  <div id="chat"></div>
  <div id="inputWrap">
    <div id="promoBar"><button class="x" onclick="hidePromo()">&times;</button><div id="promoTxt"></div><div class="upRow"><button onclick="openPlans('premium')" data-i="btn_premium"></button><button onclick="openPlans('ultra')" data-i="btn_ultra"></button></div></div>
    <div id="limitBar"><div id="limitTxt"></div><div class="upRow"><button onclick="openPlans('ultra')" data-i="btn_ultra"></button><button onclick="openPlans('premium')" data-i="btn_premium"></button></div></div>
    <div id="modeRow"><button id="webBtn" onclick="cycleWeb()"></button><button id="imgBtn" onclick="toggleImg()"></button></div>
    <div id="chip"><span id="chipName"></span><button onclick="removeFile()">&times;</button></div>
    <div id="bar">
      <button class="ibtn" onclick="document.getElementById('file').click()">+</button>
      <textarea id="box" rows="1" dir="auto" data-ph="ph"></textarea>
      <button class="ibtn" id="mic" onclick="toggleMic()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
      <button class="ibtn" id="send" onclick="send()">&#8593;</button>
    </div>
    <input type="file" id="file" style="display:none" accept="image/*,.pdf,.docx,.txt,.md,.csv,.json,.js,.html,.css,.py,.java,.c,.cpp,.xml,.log">
  </div>
</div>

<div id="overlay" onclick="closeSide()"></div>
<div id="side">
  <button id="newBtn" onclick="newChat()" data-i="side_new"></button>
  <input id="q" data-ph="search">
  <div id="list"></div>
  <div class="foot">
    <div class="prof" onclick="openSettings()"><div id="sideAv"></div><div class="pt"><div id="sideName"></div><div id="who"></div></div></div>
    <button onclick="openPlans()" data-i="plans_btn"></button>

function L(k, v){
  var s = (STR[uiLang] && STR[uiLang][k]);

/* ---------- Background colour ---------- */
var BG_PRESETS = ["#ffffff","#fff3b0","#d9f2d9","#e6d9f7","#d6e8fb","#fbdde8","#ffe3c7","#d3f0ee","#e4e4e4","#121212"];
var curBg = "#ffffff";
function hex2rgb(h){
  h = h.replace("#", "");
  if(h.length === 3) h = h.split("").map(function(c){ return c + c; }).join("");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgb2hex(r){
  return "#" + r.map(function(x){ x = Math.max(0, Math.min(255, Math.round(x))); return ("0" + x.toString(16)).slice(-2); }).join("");
}
function mix(a, b, p){
  var A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex([A[0] + (B[0] - A[0]) * p, A[1] + (B[1] - A[1]) * p, A[2] + (B[2] - A[2]) * p]);
}
function applyBg(hex){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex || "")) hex = "#ffffff";
  hex = hex.toLowerCase();
  curBg = hex;
  var c = hex2rgb(hex);
  var dark = (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255 < 0.5;
  var st = document.documentElement.style;
  function set(k, v){ st.setProperty("--" + k, v); }
  set("bg", hex);
  if(dark){
    set("text","#ececec"); set("muted","#a8a8a8"); set("card", mix(hex,"#ffffff",0.07)); set("soft", mix(hex,"#ffffff",0.12));
    set("soft2", mix(hex,"#ffffff",0.2)); set("border", mix(hex,"#ffffff",0.22)); set("side", mix(hex,"#ffffff",0.04));
    set("btn","#ececec"); set("btnText","#111111"); set("link","#7db0ff");
  }else{
    set("text","#1a1a1a"); set("muted","#666666"); set("card", mix(hex,"#ffffff",0.7)); set("soft", mix(hex,"#000000",0.06));
    set("soft2", mix(hex,"#000000",0.1)); set("border", mix(hex,"#000000",0.15)); set("side", mix(hex,"#000000",0.03));
    set("btn","#1a1a1a"); set("btnText","#ffffff"); set("link","#1a56db");
  }
  st.colorScheme = dark ? "dark" : "light";
  var mt = document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute("content", hex);
}
function buildSwatches(){
  var h = document.getElementById("swatches");
  h.innerHTML = "";
  BG_PRESETS.forEach(function(c){
    var b = document.createElement("button");
    b.className = "sw";
    b.style.background = c;
    b.setAttribute("data-c", c);
    b.onclick = function(){ pickBg(c); };
    h.appendChild(b);
  });
}
function markSwatches(){
  var h = document.getElementById("swatches");
  for(var i = 0; i < h.children.length; i++){
    h.children[i].classList.toggle("on", h.children[i].getAttribute("data-c") === curBg);
  }
  document.getElementById("bgPick").value = curBg;
}
function pickBg(hex){
  applyBg(hex);
  try{ localStorage.setItem("nestyBg", curBg); }catch(e){}
  markSwatches();
}
try{ applyBg(localStorage.getItem("nestyBg") || "#ffffff"); }catch(e){ applyBg("#ffffff"); }

var updating = false;
function showUpdate(worker){
  var b = $("updateBar");
  b.textContent = L("upd");
  b.style.display = "block";
  b.onclick = function(){ updating = true; b.textContent = L("updating"); worker.postMessage("skipWaiting"); };
}
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/sw.js").then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener("updatefound", function(){
        var nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", function(){
          if(nw.state === "installed" && navigator.serviceWorker.controller) showUpdate(nw);
        });
      });
      setInterval(function(){ reg.update().catch(function(){}); }, 30 * 60 * 1000);
    }).catch(function(){});
  });
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(updating) location.reload();
  });
}

async function submitAuth(){
  var email = $("aEmail").value.trim().toLowerCase();
  var pass = $("aPass").value;
  if(!email || email.indexOf("@") < 1){ $("authErr").textContent = L("e_email"); return; }
  if(authMode === "signup"){
    var name = $("aName").value.trim().replace(/\s+/g, " ");
    var age = parseInt($("aAge").value, 10);
    if(name.length < 3 || name.indexOf(" ") < 1){ $("authErr").textContent = L("e_fullname"); return; }
    if(!(age >= 13 && age <= 120)){ $("authErr").textContent = L("e_age"); return; }
    if(pass.length < 8){ $("authErr").textContent = L("e_pass"); return; }
    if(pass !== $("aPass2").value){ $("authErr").textContent = L("e_match"); return; }
    $("sendBtn").disabled = true;
    $("authErr").textContent = "";
    try{
      var nu = await account.create(ID.unique(), email, pass, name);
      authUserId = nu.$id;
      authEmail = email;
      pendName = name;
      pendAge = age;
      await account.createEmailToken(authUserId, email);
      codeFlow = "signup";
      goCodeStep();
    }catch(e){
      $("authErr").textContent = (e && e.code === 409) ? L("e_exists") : ((e && e.message) || L("e_send"));
    }
    $("sendBtn").disabled = false;
    return;
  }
  if(!pass){ $("authErr").textContent = L("e_pwreq"); return; }
  $("sendBtn").disabled = true;
  $("authErr").textContent = "";

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<i>$2</i>");
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function mdToHtml(src){
  var lines = src.split("\n");
  var out = [];
  var i = 0;
  function isSep(l){
    return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.indexOf("-") > -1 && l.indexOf("|") > -1;
  }
  function cells(l){
    l = l.trim();
    if(l.charAt(0) === "|") l = l.slice(1);
    if(l.charAt(l.length - 1) === "|") l = l.slice(0, -1);
    return l.split("|").map(function(c){ return c.trim(); });
  }
  function isUl(l){ return /^\s*[-*+]\s+/.test(l); }
  function isOl(l){ return /^\s*\d+[.)]\s+/.test(l); }
  function startsBlock(l, nxt){
    return /^#{1,6}\s+/.test(l) || isUl(l) || isOl(l) || /^\s*>/.test(l) ||
      /^\s*([-*_])\1{2,}\s*$/.test(l) || (l.indexOf("|") > -1 && nxt !== undefined && isSep(nxt));
  }
  while(i < lines.length){
    var l = lines[i];
    if(!l.trim()){ i++; continue; }
    var m = l.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      var lv = Math.min(m[1].length, 3) + 1;
      out.push("<h" + lv + ">" + mdInline(m[2]) + "</h" + lv + ">");
      i++; continue;
    }
    if(/^\s*([-*_])\1{2,}\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(l.indexOf("|") > -1 && i + 1 < lines.length && isSep(lines[i + 1])){
      var head = cells(l);
      i += 2;
      var rows = [];
      while(i < lines.length && lines[i].trim() && lines[i].indexOf("|") > -1){
        rows.push(cells(lines[i]));
        i++;
      }
      var h = "<div class=\"tbl\"><table><thead><tr>";
      head.forEach(function(c){ h += "<th>" + mdInline(c) + "</th>"; });
      h += "</tr></thead><tbody>";
      rows.forEach(function(r){
        h += "<tr>";
        for(var k = 0; k < head.length; k++){ h += "<td>" + mdInline(r[k] || "") + "</td>"; }
        h += "</tr>";
      });
      h += "</tbody></table></div>";
      out.push(h);
      continue;
    }
    if(/^\s*>/.test(l)){
      var q = [];
      while(i < lines.length && /^\s*>/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote>" + q.map(mdInline).join("<br>") + "</blockquote>");
      continue;
    }
    if(isUl(l) || isOl(l)){
      var ord = isOl(l);
      var items = [];
      while(i < lines.length && (ord ? isOl(lines[i]) : isUl(lines[i]))){
        items.push(lines[i].replace(ord ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/, ""));
        i++;
      }
      var tag = ord ? "ol" : "ul";
      out.push("<" + tag + ">" + items.map(function(it){ return "<li>" + mdInline(it) + "</li>"; }).join("") + "</" + tag + ">");
      continue;
    }
    var para = [l];
    i++;
    while(i < lines.length && lines[i].trim() && !startsBlock(lines[i], lines[i + 1])){
      para.push(lines[i]);
      i++;
    }
    out.push("<p>" + para.map(mdInline).join("<br>") + "</p>");
  }
  return out.join("");
}

function copyText(text, btn){
  function done(){
    if(!btn) return;
    var old = btn.textContent;
    btn.textContent = L("copied");
    setTimeout(function(){ btn.textContent = old; }, 1500);
  }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    ta.remove();
    done();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else{
    fallback();
  }
}

function apiContent(m){
  var s = m.text;
  if(m.file){
    s = "[Attached file: " + m.file.name + "]\n" + m.file.text + "\n[End of file]\n\n" + m.text;
  }
  if(m.image && !m.image.data){
    s = "[The user attached a picture named " + m.image.name + ", which is no longer available.]\n\n" + s;
  }
  return s;
}

function packMessages(){
  return JSON.stringify(messages, function(k, v){ return k === "data" ? undefined : v; });
}

function apiMessages(){
  var keep = {};
  var n = 0;
  for(var i = messages.length - 1; i >= 0 && n < 2; i--){
    if(messages[i].role === "user" && messages[i].image && messages[i].image.data){ keep[i] = true; n++; }
  }
  return messages.map(function(m, i){
    if(m.role !== "user") return {role: m.role, content: m.content};
    if(keep[i]){
      return {role: "user", content: [
        {type: "text", text: apiContent(m)},
        {type: "image_url", image_url: {url: m.image.data}}
      ]};
    }
    return {role: "user", content: apiContent(m)};
  });
}

function buildUser(m, i){
  var d = document.createElement("div");
  d.className = "msg user";
  d.dir = "auto";
  if(m.file){
    var tag = document.createElement("span");
    tag.className = "fileTag";
    tag.textContent = m.file.name;
    d.appendChild(tag);
    d.appendChild(document.createElement("br"));
  }
  if(m.image){
    if(m.image.data){
      var im = document.createElement("img");
      im.className = "thumb";
      im.src = m.image.data;
      d.appendChild(im);
    }else{
      var tg = document.createElement("span");
      tg.className = "fileTag";
      tg.textContent = L("notsaved", {n: m.image.name});
      d.appendChild(tg);
      d.appendChild(document.createElement("br"));
    }
  }
  d.appendChild(document.createTextNode(m.text));

  var timer = null, sx = 0, sy = 0;
  d.addEventListener("pointerdown", function(e){
    sx = e.clientX; sy = e.clientY;
    timer = setTimeout(function(){ showMenu(i, sx, sy); }, 450);
  });
  function cancel(){ clearTimeout(timer); }
  d.addEventListener("pointerup", cancel);
  d.addEventListener("pointercancel", cancel);
  d.addEventListener("pointermove", function(e){
    if(Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel();
  });
  d.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  return d;
}

function buildBot(m, isLast){
  var d = document.createElement("div");
  d.className = "msg bot";
  d.dir = "auto";
  if(m.genImage){
    if(m.genImage.data){
      var gi = document.createElement("img");
      gi.className = "gimg";
      gi.src = m.genImage.data;
      gi.alt = "Picture made by Nesty";
      d.appendChild(gi);
      var ga = document.createElement("div");
      ga.className = "actions";
      var dl = document.createElement("a");
      dl.className = "cpbtn";
      dl.style.textDecoration = "none";
      dl.href = m.genImage.data;
      dl.download = "nesty-picture.jpg";
      dl.textContent = L("download");
      ga.appendChild(dl);
      if(isLast){
        var mk = document.createElement("button");
        mk.className = "cpbtn";
        mk.textContent = L("another");
        mk.onclick = function(){ regenerate(); };
        ga.appendChild(mk);
      }
      d.appendChild(ga);
    }else{
      var gn = document.createElement("div");
      gn.className = "gnote";
      gn.textContent = L("oldpic");
      d.appendChild(gn);
      var again = document.createElement("button");
      again.className = "cpbtn";
      again.textContent = L("again");
      again.onclick = function(){ if(!loading) makeImageChecked(m.genImage.prompt); };
      d.appendChild(again);
    }
    return d;
  }
  var parts = m.content.split("```");
  for(var i = 0; i < parts.length; i++){
    if(i % 2 === 1){
      var code = parts[i];
      var nl = code.indexOf("\n");
      if(nl > -1 && nl <= 15 && code.slice(0, nl).trim().indexOf(" ") === -1){
        code = code.slice(nl + 1);
      }
      code = code.replace(/\n+$/,"");
      var wrap = document.createElement("div");
      wrap.className = "code";
      var bar = document.createElement("div");
      bar.className = "codebar";
      var cb = document.createElement("button");
      cb.className = "cpbtn";
      cb.textContent = L("copy");
      (function(c, b){ b.onclick = function(){ copyText(c, b); }; })(code, cb);
      bar.appendChild(cb);
      var pre = document.createElement("pre");
      pre.textContent = code;
      wrap.appendChild(bar);
      wrap.appendChild(pre);
      d.appendChild(wrap);
    }else{
      var s = parts[i].replace(/^\n+|\n+$/g,"");
      if(!s) continue;
      var tx = document.createElement("div");
      tx.className = "txt";
      tx.innerHTML = mdToHtml(s);
      d.appendChild(tx);
    }
  }
  if(m.sources && m.sources.length){
    var sd = document.createElement("div");
    sd.className = "src";
    sd.appendChild(document.createTextNode(L("sources")));
    m.sources.forEach(function(so){
      if(!so || !/^https?:\/\//.test(so.uri || "")) return;
      var a = document.createElement("a");
      a.href = so.uri;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = so.title || "source";
      sd.appendChild(a);
    });
    d.appendChild(sd);
  }
  var act = document.createElement("div");
  act.className = "actions";
  var cp = document.createElement("button");
  cp.className = "cpbtn";
  cp.textContent = L("copy");
  cp.onclick = function(){ copyText(m.content, cp); };
  act.appendChild(cp);
  if(isLast){
    var rg = document.createElement("button");
    rg.className = "cpbtn";
    rg.textContent = L("regen");
    rg.onclick = function(){ regenerate(); };
    act.appendChild(rg);
  }
  d.appendChild(act);
  return d;
}

function regenerate(){
  if(loading) return;
  var last = messages[messages.length - 1];
  if(!last || last.role !== "assistant") return;
  if(last.genImage){
    if(imgLimitUntil > Date.now()){ showLimit("img"); return; }
    var pr = last.genImage.prompt;
    messages.pop();
    makeImage(pr);
    return;
  }
  if(limitUntil > Date.now()){ showLimit("msg"); return; }
  messages.pop();
  ask();
}

function makeImageChecked(prompt){
  if(imgLimitUntil > Date.now()){ showLimit("img"); return; }
  makeImage(prompt);
}

function todayText(){
  try{
    return new Date().toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long", year: "numeric"});

async function getJwt(){

/* ---------- Limits (set by the server for each plan; every window is 5 hours) ---------- */
var limitUntil = 0, imgLimitUntil = 0, fileLimitUntil = 0, limitTimer = null;
var LIM_KEYS = {msg: "nestyLimit", img: "nestyImgLimit", file: "nestyFileLimit"};
try{
  limitUntil = parseInt(localStorage.getItem("nestyLimit"), 10) || 0;
  imgLimitUntil = parseInt(localStorage.getItem("nestyImgLimit"), 10) || 0;
  fileLimitUntil = parseInt(localStorage.getItem("nestyFileLimit"), 10) || 0;
}catch(e){}
function setLimit(kind, until){
  if(kind === "img") imgLimitUntil = until; else if(kind === "file") fileLimitUntil = until; else limitUntil = until;
  try{ localStorage.setItem(LIM_KEYS[kind] || LIM_KEYS.msg, String(until)); }catch(e){}
}
function timeText(ms){
  try{ return new Date(ms).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); }
  catch(e){ return new Date(ms).toTimeString().slice(0, 5); }
}
function whenText(ms){
  var d = new Date(ms);
  if(d.toDateString() === new Date().toDateString()) return timeText(ms);
  try{ return d.toLocaleDateString([], {day: "numeric", month: "short"}) + ", " + timeText(ms); }
  catch(e){ return timeText(ms); }
}
function fullWhen(ms){
  try{ return new Date(ms).toLocaleString([], {dateStyle: "medium", timeStyle: "short"}); }
  catch(e){ return new Date(ms).toString(); }
}
function leftText(ms){
  var mins = Math.max(1, Math.ceil((ms - Date.now()) / 60000));
  var h = Math.floor(mins / 60), mm = mins % 60;
  return h ? h + "h " + mm + "m" : mm + "m";
}
function showLimit(kind){
  var until = kind === "img" ? imgLimitUntil : (kind === "file" ? fileLimitUntil : limitUntil);
  var bar = $("limitBar");
  clearTimeout(limitTimer);
  if(until > Date.now()){
    hidePromo();
    $("limitTxt").textContent = L(kind === "img" ? "lim_img" : (kind === "file" ? "lim_file" : "lim_msg"), {t: whenText(until), r: leftText(until)});
    bar.style.display = "block";
    limitTimer = setTimeout(function(){ bar.style.display = "none"; }, until - Date.now() + 500);
  }else{
    bar.style.display = "none";
  }
}

async function ask(){
  loading = true;
  aborter = new AbortController();
  renderAll();
  var reply = null;
  var sources = [];
  try{
    var jwt = await getJwt();
    var lu = messages[messages.length - 1];
    var wantSearch = !!(lu && lu.role === "user" && !(lu.image && lu.image.data) && !lu.file && needsWeb(lu.text));
    searchingNow = wantSearch;
    if(wantSearch) renderAll();
    var res = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json", "X-Nesty-Token": jwt},
      signal: aborter.signal,
      body: JSON.stringify({
        userName: firstName(),
        today: todayText(),
        instructions: (user.prefs && user.prefs.instructions) || "",
        memory: getMem(),
        search: wantSearch,
        messages: apiMessages()
      })
    });
    var data = await res.json();
    if(data.limited){
      loading = false;
      searchingNow = false;
      aborter = null;
      var last = messages.pop();
      if(last && last.role === "user"){
        box.value = last.text;
        if(last.file){
          pendingFile = last.file;
          $("chipName").textContent = last.file.name;
          $("chip").style.display = "flex";
        }
        if(last.image){
          pendingImage = last.image;
          $("chipName").textContent = last.image.name;
          $("chip").style.display = "flex";
        }
      }
      var kd = data.kind === "file" ? "file" : "msg";
      setLimit(kd, data.resetAt || (Date.now() + 5 * 3600 * 1000));
      showLimit(kd);
      renderAll();
      return;
    }
    if(data.needLogin){
      loading = false;
      messages.pop();
      renderAll();
      toast(L("session"));
      jwtCache = {token: "", exp: 0};
      setTimeout(function(){ location.reload(); }, 1800);
      return;
    }
    if(data.needVerify){
      loading = false;
      messages.pop();
      renderAll();
      toast(L("needverify"));
      logout();
      return;
    }
    reply = data.reply || "Sorry, something went wrong.";
    sources = data.sources || [];
    if(data.remember && data.remember.length) addFacts(data.remember);
    noteUsage(data);
    if(typeof data.left === "number" && data.left <= 5 && data.left >= 0){
      toast(L("left_m", {n: data.left}));
    }
  }catch(e){
    if(e && e.name === "AbortError"){
      loading = false;
      searchingNow = false;
      aborter = null;
      renderAll();
      toast(L("stopped"));
      saveChat();
      return;
    }
    reply = "Network error. Please try again.";
  }
  loading = false;
  aborter = null;
  searchingNow = false;
  messages.push({role:"assistant", content:reply, sources:sources});
  renderAll();
  if(speakOn || voiceTurn) speak(reply);
  voiceTurn = false;
  saveChat();
}

async function addLogo(dataUrl){
  try{
    var pic = await loadPic(dataUrl);
    var logo = await loadPic("/icon-192.png");
    var c = document.createElement("canvas");
    c.width = pic.width; c.height = pic.height;
    var g = c.getContext("2d");
    g.drawImage(pic, 0, 0);
    var size = Math.max(26, Math.round(Math.min(c.width, c.height) * 0.07));
    var pad = Math.round(size * 0.3);
    var fs = Math.round(size * 0.46);
    g.font = "600 " + fs + "px system-ui, sans-serif";
    var label = "Nesty AI";
    var tw = g.measureText(label).width;
    var bw = pad + size + pad + tw + pad, bh = size + pad * 2;
    var x0 = c.width - bw - pad, y0 = c.height - bh - pad, r = bh / 2;
    g.fillStyle = "rgba(0,0,0,0.45)";
    g.beginPath();
    g.moveTo(x0 + r, y0);
    g.arcTo(x0 + bw, y0, x0 + bw, y0 + bh, r);
    g.arcTo(x0 + bw, y0 + bh, x0, y0 + bh, r);
    g.arcTo(x0, y0 + bh, x0, y0, r);
    g.arcTo(x0, y0, x0 + bw, y0, r);
    g.closePath();
    g.fill();
    g.save();
    g.beginPath();
    var lx = x0 + pad, ly = y0 + pad, lr = size * 0.22;
    g.moveTo(lx + lr, ly);
    g.arcTo(lx + size, ly, lx + size, ly + size, lr);
    g.arcTo(lx + size, ly + size, lx, ly + size, lr);
    g.arcTo(lx, ly + size, lx, ly, lr);
    g.arcTo(lx, ly, lx + size, ly, lr);
    g.closePath();
    g.clip();
    g.drawImage(logo, lx, ly, size, size);
    g.restore();
    g.fillStyle = "#ffffff";
    g.textBaseline = "middle";
    g.fillText(label, lx + size + pad, y0 + bh / 2 + 1);
    return c.toDataURL("image/jpeg", 0.92);
  }catch(e){
    return dataUrl;
  }
}

/* ---------- File attach ---------- */
var fileInput = $("file");
var libLoading = {};

function loadScript(src){
  if(libLoading[src]) return libLoading[src];
  libLoading[src] = new Promise(function(resolve, reject){
    var sc = document.createElement("script");
    sc.src = src;
    sc.onload = resolve;
    sc.onerror = function(){ delete libLoading[src]; reject(new Error("Could not load the file reader. Check your internet.")); };
    document.head.appendChild(sc);
  });
  return libLoading[src];
}

function fitImage(file, max, square, quality){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height, sx = 0, sy = 0, sw = w, sh = h, cw, ch;
      if(square){
        var side = Math.min(w, h);
        sx = Math.round((w - side) / 2); sy = Math.round((h - side) / 2);
        sw = side; sh = side; cw = max; ch = max;
      }else{
        var sc = Math.min(1, max / Math.max(w, h));
        cw = Math.round(w * sc); ch = Math.round(h * sc);
      }
      var c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Could not open this picture.")); };
    img.src = url;
  });
}

async function readPdf(file){
  await loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  var buf = await file.arrayBuffer();
  var pdf = await pdfjsLib.getDocument({data: buf}).promise;
  var out = "";
  var max = Math.min(pdf.numPages, 60);
  for(var p = 1; p <= max; p++){
    var page = await pdf.getPage(p);
    var tc = await page.getTextContent();
    out += tc.items.map(function(it){ return it.str; }).join(" ") + "\n\n";
    if(out.length > 20000) break;
  }
  return out;
}

async function readDocx(file){
  await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js");
  var buf = await file.arrayBuffer();
  var r = await mammoth.extractRawText({arrayBuffer: buf});
  return r.value || "";
}

function readText(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(){ reject(new Error(L("read_fail"))); };
    r.readAsText(file);
  });
}

fileInput.addEventListener("change", async function(){
  var f = fileInput.files[0];
  fileInput.value = "";
  if(!f) return;
  var name = f.name;
  var lower = name.toLowerCase();
  try{
    if(f.type.indexOf("image/") === 0){
      if(f.size > 20 * 1000000){ toast(L("pic_big")); return; }
      showChip(L("preparing"));
      var data = await fitImage(f, 1280, false, 0.82);
      pendingFile = null;
      pendingImage = {name: name, data: data};
      showChip(name);
      return;
    }
    if(lower.slice(-4) === ".doc" || lower.slice(-4) === ".ppt" || lower.slice(-4) === ".xls" || lower.slice(-5) === ".pptx" || lower.slice(-5) === ".xlsx"){
      toast(L("unsupported"));
      return;
    }
    if(f.size > 15 * 1000000){ toast(L("file_big")); return; }
    var text = "";
    showChip(L("reading", {n: name}));
    if(lower.slice(-4) === ".pdf" || f.type === "application/pdf"){
      text = await readPdf(f);
      if(text.replace(/\s/g, "").length < 20){
        removeFile();
        toast(L("pdf_empty"));
        return;
      }
    }else if(lower.slice(-5) === ".docx"){
      text = await readDocx(f);
      if(text.replace(/\s/g, "").length < 5){
        removeFile();
        toast(L("docx_empty"));
        return;
      }
    }else{
      if(f.size > 1000000){ removeFile(); toast(L("txt_big")); return; }
      text = await readText(f);
    }
    if(text.length > 20000){ text = text.slice(0, 20000) + "\n...[file cut because it is long]"; }
    pendingImage = null;
    pendingFile = {name: name, text: text};
    showChip(name);
  }catch(e){
    removeFile();
    toast((e && e.message) || L("read_fail"));
  }
});

  if(e.key === "Enter" && !e.shiftKey && window.matchMedia && window.matchMedia("(pointer:fine)").matches){
    e.preventDefault();

});

/* ---------- Voice ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false;
var micBtn = $("mic");

function toggleMic(){
  if(!SR){ alert("Voice input is not supported in this browser."); return; }
  if(listening){ rec.stop(); return; }
  rec = new SR();
  rec.lang = voiceLang;
  rec.interimResults = false;
  rec.onstart = function(){ listening = true; micBtn.classList.add("on"); };
  rec.onend = function(){ listening = false; micBtn.classList.remove("on"); };
  rec.onerror = function(ev){ listening = false; micBtn.classList.remove("on"); toast("Mic problem: " + ((ev && ev.error) || "unknown")); };
  rec.onresult = function(e){
    box.value = e.results[0][0].transcript;
    voiceTurn = true;
    send();
  };
  rec.start();
}

function drawSpk(){
  var b = $("spk");
  b.textContent = L("voice") + ": " + (speakOn ? L("on") : L("off"));
  b.classList.toggle("on", speakOn);
}
function toggleSpeak(){
  speakOn = !speakOn;
  drawSpk();
  if(!speakOn && window.speechSynthesis) speechSynthesis.cancel();
}
function speak(text){
  if(!window.speechSynthesis) return;
  var clean = text.replace(/```[\s\S]*?```/g, " code block ").replace(/[*`#]/g, "");
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(clean);
  u.lang = voiceLang;
  speechSynthesis.speak(u);
}

/* ---------- Custom instructions and memory ---------- */
function getMem(){
  var m = user && user.prefs && user.prefs.memory;
  return Array.isArray(m) ? m : [];
}
function drawMemory(){
  var holder = $("memList");
  holder.innerHTML = "";
  var m = getMem();
  if(!m.length){
    holder.innerHTML = '<div class="muted2">' + L("s_mem_none") + '</div>';
    $("memClear").style.display = "none";
    return;
  }
  $("memClear").style.display = "inline-block";
  m.forEach(function(f, i){
    var r = document.createElement("div");
    r.className = "memItem";
    var s = document.createElement("span");
    s.dir = "auto";
    s.textContent = f;
    var x = document.createElement("button");
    x.innerHTML = "&times;";
    x.onclick = function(){ delMem(i); };
    r.appendChild(s);
    r.appendChild(x);
    holder.appendChild(r);
  });
}
async function delMem(i){
  var m = getMem().slice();
  m.splice(i, 1);
  try{ await savePrefs({memory: m}); drawMemory(); }
  catch(e){ sMsg("Could not delete: " + (e.message || "error")); }
}
async function clearMemory(){
  if(!confirm(L("conf_mem"))) return;
  try{ await savePrefs({memory: []}); drawMemory(); sMsg(L("mem_cleared")); }
  catch(e){ sMsg("Could not clear: " + (e.message || "error")); }
}
async function saveInstr(){
  try{
    await savePrefs({instructions: $("sInstr").value.trim().slice(0, 600)});
    sMsg(L("instr_ok"));
  }catch(e){
    sMsg("Could not save: " + (e.message || "error"));
  }
}
async function addFacts(list){
  var m = getMem().slice();
  var changed = false;
  list.forEach(function(f){
    f = String(f).trim().slice(0, 200);
    if(f && m.indexOf(f) < 0){ m.push(f); changed = true; }
  });
  if(!changed) return;
  while(m.length > 30) m.shift();
  try{ await savePrefs({memory: m}); toast(L("mem_saved")); }catch(e){}
}

  $("sUi").value = uiLang;
  $("aLang").value = uiLang;

  voiceLang = v;
  try{ localStorage.setItem("nestyVoiceLang", v); }catch(e){}
  toast(L("vlang_ok"));
}

/* ---------- Plans, usage, activation codes ---------- */
var PAY_NUMBER = "0701244268";
var PLAN_DATA = {
  free: {n: "Free", msg: 40, file: 30, img: 6},
  premium: {n: "Premium", msg: 60, file: 50, img: 6, m: 50, y: 600},
  ultra: {n: "Ultra", msg: 80, file: 70, img: 20, m: 100, y: 36000}
};
var me = null, plansOpen = false, plansFocus = "", promoTimer = null;
function money(n){ return "KSh " + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function curPlan(){ return (me && PLAN_DATA[me.plan]) ? me.plan : "free"; }
function curPlanText(){
  var cp = curPlan();
  if(cp === "free"){
    var t = L("on_free");
    if(me && me.expiredPlan && PLAN_DATA[me.expiredPlan]) t += " " + L("expired_note", {plan: PLAN_DATA[me.expiredPlan].n, t: fullWhen(me.expiredAt)});
    return t;
  }
  return L("on_plan", {plan: PLAN_DATA[cp].n, t: fullWhen(me.expiresAt)});
}
function drawPlanBtn(){
  var b = $("planBtn");
  if(!b) return;
  var cp = curPlan();
  b.textContent = cp === "free" ? L("upgrade") : PLAN_DATA[cp].n;
  b.className = "hbtn " + (cp === "free" ? "up" : "plan");
}
function drawSub(){ if($("subTxt")) $("subTxt").textContent = curPlanText(); }
async function api(path, payload){
  var jwt = await getJwt();
  var res = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Nesty-Token": jwt}, body: JSON.stringify(payload || {})});
  return res.json();
}
async function loadMe(){
  try{
    var d = await api("/api/me");
    if(d && d.plan){ me = d; drawPlanBtn(); drawSub(); if(plansOpen) renderPlans(); }
  }catch(e){}
}
function noteUsage(d){
  if(!d || !d.plan) return;
  if(!me || me.plan !== d.plan){ loadMe(); }
  if(d.plan === "free" && typeof d.used === "number" && d.used > 0 && d.used % 10 === 0) showPromo();
}
function showPromo(){
  $("promoTxt").textContent = L("promo");
  $("promoBar").style.display = "block";
  clearTimeout(promoTimer);
  promoTimer = setTimeout(hidePromo, 30000);
}
function hidePromo(){
  clearTimeout(promoTimer);
  if($("promoBar")) $("promoBar").style.display = "none";
}
function renderPlans(){
  var body = $("plansBody");
  if(!body) return;
  var cp = curPlan();
  $("curPlan").textContent = curPlanText();
  var h = "";
  if(me && me.usage){
    h += '<div class="pcard"><h3>' + L("use_title") + '</h3><ul>';
    [["msg","k_msg"],["file","k_file"],["img","k_img"]].forEach(function(k){
      var u = me.usage[k[0]] || {used: 0, limit: 0, resetAt: 0};
      h += '<li>' + (u.resetAt && u.used
        ? L("use_line", {k: L(k[1]), u: u.used, l: u.limit, t: whenText(u.resetAt)})
        : L("use_line0", {k: L(k[1]), u: u.used, l: u.limit})) + '</li>';
    });
    h += '</ul></div>';
  }
  ["free","premium","ultra"].forEach(function(id){
    var p = PLAN_DATA[id];
    h += '<div class="pcard' + (id === cp ? ' cur' : '') + (id === plansFocus ? ' focus' : '') + '" id="pc_' + id + '"><h3>' + p.n + (id === cp ? ' · ' + L("current") : '') + '</h3>';
    h += '<div class="price">' + (id === "free" ? L("free_price") : money(p.m) + ' / ' + L("monthly") + ' · ' + money(p.y) + ' / ' + L("yearly")) + '</div>';
    h += '<ul><li>' + L("pl_msg", {n: p.msg}) + '</li><li>' + L("pl_file", {n: p.file}) + '</li><li>' + L("pl_img", {n: p.img}) + '</li></ul></div>';
  });
  h += '<div class="muted2">' + L("pl_win") + '</div>';
  body.innerHTML = h;
  $("howList").innerHTML = '<li>' + L("how1", {num: PAY_NUMBER}) + '</li><li>' + L("how2") + '</li><li>' + L("how3") + '</li><li>' + L("how4") + '</li>';
}
function openPlans(focus){
  closeSide();
  closeSettings();
  plansOpen = true;
  plansFocus = focus || "";
  hidePromo();
  renderPlans();
  $("plans").style.display = "block";
  if(user) loadMe();
  if(focus){
    setTimeout(function(){
      var el = $("pc_" + focus);
      if(el) el.scrollIntoView({behavior: "smooth", block: "start"});
    }, 60);
  }
}
function closePlans(){
  plansOpen = false;
  $("plans").style.display = "none";
}
function sendProof(){
  var body = "Hello Red element,\n\nI paid KSh ____ to " + PAY_NUMBER + " for the ______ plan (monthly / yearly).\nMy Nesty email: " + (user ? user.email : "") + "\nPayment confirmation message:\n\n";
  location.href = "mailto:isenyealvin@gmail.com?subject=" + encodeURIComponent("Nesty AI payment") + "&body=" + encodeURIComponent(body);
}
async function redeemCode(){
  var code = $("actCode").value.trim();
  if(!code) return;
  var msg = $("actMsg");
  $("actBtn").disabled = true;
  msg.className = "muted2";
  msg.textContent = "...";
  try{
    var d = await api("/api/redeem", {code: code});
    if(d.ok){
      $("actCode").value = "";
      msg.className = "muted2 ok";
      msg.textContent = L("act_ok", {plan: PLAN_DATA[d.plan] ? PLAN_DATA[d.plan].n : d.plan, t: fullWhen(d.expiresAt)});
      setLimit("msg", 0); setLimit("img", 0); setLimit("file", 0);
      $("limitBar").style.display = "none";
      await loadMe();
    }else{
      msg.className = "muted2 bad";
      msg.textContent = d.error || L("act_fail");
    }
  }catch(e){
    msg.className = "muted2 bad";
    msg.textContent = L("act_fail");
  }
  $("actBtn").disabled = false;
}
async function changePassword(){
  var op = $("pwOld").value, np = $("pwNew").value, nc = $("pwNew2").value;
  if(np.length < 8){ sMsg(L("e_pass")); return; }
  if(np !== nc){ sMsg(L("e_match")); return; }
  try{
    if(op) await account.updatePassword(np, op); else await account.updatePassword(np);
    $("pwOld").value = ""; $("pwNew").value = ""; $("pwNew2").value = "";
    sMsg(L("pw_ok"));
  }catch(e){
    sMsg((e && e.message) || "error");
  }
}

markSwatches();
fillLangs();
applyLang();
init();
